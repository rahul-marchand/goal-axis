<html lang="en">

<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&display=swap">
<style>
  :root {
    --paper: #f6f4ef;
    --panel: #fdfcf9;
    --ink: #23252b;
    --ink-soft: #5c5f6a;
    --line: #d9d5cc;
    --wall: #2e313b;
    --floor: #efece4;
    --rich: #d55e00;
    --poor: #0072b2;
    --rich-tint: #f3d0b8;
    --poor-tint: #bcd8ea;
    --timeout: #c9c5bb;
    --handle: #23252b;
    --focus: #8a63d2;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #191b21; --panel: #20232b; --ink: #e8e6df; --ink-soft: #9a9da8;
      --line: #383c47; --wall: #0e0f13; --floor: #2a2d36;
      --rich: #f08c3a; --poor: #4ea6dd; --rich-tint: #57402e; --poor-tint: #2c4557;
      --timeout: #454854; --handle: #e8e6df; --focus: #a98ae6;
    }
  }
  :root[data-theme="dark"] {
    --paper: #191b21; --panel: #20232b; --ink: #e8e6df; --ink-soft: #9a9da8;
    --line: #383c47; --wall: #0e0f13; --floor: #2a2d36;
    --rich: #f08c3a; --poor: #4ea6dd; --rich-tint: #57402e; --poor-tint: #2c4557;
    --timeout: #454854; --handle: #e8e6df; --focus: #a98ae6;
  }
  * { margin: 0; box-sizing: border-box; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    line-height: 1.5; padding: 40px 20px 72px;
  }
  .fig { max-width: 880px; margin: 0 auto; }
  .eyebrow {
    font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-soft); font-weight: 500; margin-bottom: 10px;
  }
  h1 {
    font-size: clamp(26px, 4.5vw, 34px); font-weight: 600; letter-spacing: -0.015em;
    text-wrap: balance; margin-bottom: 8px;
  }
  .premise { color: var(--ink-soft); max-width: 62ch; margin-bottom: 30px; font-size: 15.5px; }
  .stage { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 26px 26px 20px; }
  .maze-row { display: flex; justify-content: center; margin-bottom: 8px; position: relative; }
  canvas#maze { display: block; max-width: 100%; cursor: crosshair; }
  .legend {
    display: flex; gap: 22px; justify-content: center; flex-wrap: wrap;
    font-size: 13px; color: var(--ink-soft); margin-bottom: 10px;
  }
  .legend span { display: inline-flex; align-items: center; gap: 7px; }
  .swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
  .levels {
    display: flex; gap: 8px; justify-content: center; align-items: center;
    font-size: 12.5px; color: var(--ink-soft); margin-bottom: 22px;
  }
  .levels button {
    font: 500 12.5px "IBM Plex Mono", monospace; color: var(--ink-soft);
    background: transparent; border: 1px solid var(--line); border-radius: 4px;
    padding: 3px 10px; cursor: pointer;
  }
  .levels button[aria-pressed="true"] { color: var(--paper); background: var(--ink); border-color: var(--ink); }
  .levels button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .tooltip {
    position: absolute; pointer-events: none; z-index: 3;
    background: var(--ink); color: var(--paper);
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12px;
    padding: 6px 9px; border-radius: 4px; white-space: nowrap;
    transform: translate(-50%, -130%); opacity: 0; transition: opacity 0.12s;
  }
  .dial { margin: 0 auto 6px; position: relative; }
  .dial-label {
    display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap;
    font-size: 13px; color: var(--ink-soft); margin-bottom: 4px;
  }
  .dial-label .formula { font-family: "IBM Plex Mono", ui-monospace, monospace; }
  .dial-label .formula b { color: var(--ink); font-weight: 500; }
  .alpha-readout {
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 15px;
    color: var(--ink); font-variant-numeric: tabular-nums;
  }
  svg#axis { display: block; width: 100%; overflow: visible; }
  input#slider {
    -webkit-appearance: none; appearance: none;
    position: absolute; left: 0; top: 0; width: 100%; height: 40px; margin: 0;
    background: transparent; cursor: ew-resize; z-index: 2;
  }
  input#slider::-webkit-slider-thumb { -webkit-appearance: none; width: 40px; height: 40px; background: transparent; }
  input#slider::-moz-range-thumb { width: 40px; height: 40px; background: transparent; border: none; }
  input#slider:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; border-radius: 4px; }
  .controls {
    display: flex; gap: 18px; align-items: center; flex-wrap: wrap;
    font-size: 13px; color: var(--ink-soft); margin: 16px 0 4px;
  }
  .controls button {
    font: 500 13px "IBM Plex Sans", sans-serif; color: var(--ink);
    background: transparent; border: 1px solid var(--line); border-radius: 4px;
    padding: 5px 12px; cursor: pointer; min-width: 118px;
  }
  .controls button:hover { border-color: var(--ink-soft); }
  .controls button:focus-visible, .controls input:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  .controls label { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; }
  .chips {
    margin-left: auto; display: flex; gap: 14px;
    font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 12.5px; font-variant-numeric: tabular-nums;
  }
  .chips b { color: var(--ink); font-weight: 500; }
  .curve-block { margin-top: 20px; border-top: 1px solid var(--line); padding-top: 18px; }
  .curve-title { font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; }
  svg#curve { display: block; width: 100%; overflow: visible; }
  figcaption {
    font-family: "Source Serif 4", Georgia, serif; font-size: 15.5px;
    color: var(--ink); max-width: 70ch; margin: 26px auto 0; line-height: 1.65;
  }
  figcaption .meta {
    display: block; margin-top: 10px;
    font-family: "IBM Plex Sans", sans-serif; font-size: 12.5px; color: var(--ink-soft);
  }
  @media (prefers-reduced-motion: reduce) { .tooltip { transition: none; } }
</style>

<figure class="fig">
  <div class="eyebrow">Prototype — figure 1 · goal misgeneralisation 4YP</div>
  <h1>One dial in the weights picks the agent's goal</h1>
  <p class="premise">
    Every cell is coloured by which goal a trained maze agent commits to when started there.
    Drag α — a single direction in the network's weights — and watch the decision boundary move.
  </p>

  <div class="stage">
    <div class="maze-row">
      <canvas id="maze"></canvas>
      <div class="tooltip" id="tip"></div>
    </div>
    <div class="legend" id="legend"></div>
    <div class="levels" id="levels"></div>

    <div class="dial">
      <div class="dial-label">
        <span class="formula">weights = θ<sub>trained</sub> + α · <b>v</b>&nbsp;&nbsp;<span style="font-family:'IBM Plex Sans',sans-serif">(one fitted direction; α in units of goal value)</span></span>
        <span class="alpha-readout" id="alphaOut">α = 0.00</span>
      </div>
      <div style="position:relative;height:46px">
        <svg id="axis" height="46"></svg>
        <input id="slider" type="range" step="any" aria-label="alpha, the size of the weight edit">
      </div>
    </div>

    <div class="controls">
      <button id="playBtn" type="button">Pause sweep</button>
      <label><input type="checkbox" id="ruleBox" checked> optimal-choice boundary (value − 0.05·distance)</label>
      <div class="chips" id="chips"></div>
    </div>

    <div class="curve-block">
      <div class="curve-title">The same dial on 512 unseen mazes — preference moves, competence doesn't</div>
      <svg id="curve"></svg>
    </div>
  </div>

  <figcaption id="caption"></figcaption>
</figure>

    const x0 = xOf(0, w);
    s += `<line x1="${x0}" y1="8" x2="${x0}" y2="34" stroke="${soft}" stroke-width="1" stroke-dasharray="2 2"/>`;
    s += `<text x="${x0}" y="5" text-anchor="middle" font-size="10.5" fill="${soft}" font-family="IBM Plex Sans,sans-serif">unedited</text>`;
    const xh = xOf(alpha, w);
    s += `<circle cx="${xh}" cy="22" r="9" fill="${css('--handle')}" stroke="${css('--paper')}" stroke-width="2.5"/>`;
    axis.innerHTML = s;
  }

  // ---- dose-response ----
  const curve = document.getElementById("curve");
  function drawCurve() {
    const w = curve.clientWidth || 700, h = 160, top = 12, bottom = 24;
    curve.setAttribute("height", h);
    const ink = css("--ink"), soft = css("--ink-soft"), line = css("--line");
    const rich = css("--rich"), poor = css("--poor");
    const y = v => top + (1 - v) * (h - top - bottom);
    let grid = "";
    for (const v of [0, 0.5, 1]) {
      grid += `<line x1="0" y1="${y(v)}" x2="${w}" y2="${y(v)}" stroke="${line}" stroke-width="1" ${v === 0.5 ? 'stroke-dasharray="3 3"' : ""}/>`;
      grid += `<text x="-8" y="${y(v) + 4}" text-anchor="end" font-size="10.5" fill="${soft}" font-family="IBM Plex Mono,monospace">${v * 100}%</text>`;
    }
    const path = get => DATA.pop.map((p, i) => `${i ? "L" : "M"}${xOf(p.a, w)},${y(get(p, i))}`).join("");
    const xh = xOf(alpha, w);
    const [fi, ft] = frameAt(alpha);
    const lerp = (a, b, t) => a + (b - a) * t;
    const popNow = lerp(DATA.pop[fi].rich, DATA.pop[fi + 1].rich, ft);
    const compNow = lerp(DATA.pop[fi].reached, DATA.pop[fi + 1].reached, ft);
    curve.innerHTML = `
      ${grid}
      <path d="${path((p, i) => basinFrac(L, i))}" fill="none" stroke="${soft}" stroke-width="1.4" stroke-dasharray="4 3" opacity="0.75"/>
      <path d="${path(p => p.reached)}" fill="none" stroke="${poor}" stroke-width="1.4" opacity="0.55"/>
      <path d="${path(p => p.rich)}" fill="none" stroke="${rich}" stroke-width="2.4"/>
      <line x1="${xh}" y1="${top - 6}" x2="${xh}" y2="${h - bottom}" stroke="${ink}" stroke-width="1"/>
      <circle cx="${xh}" cy="${y(popNow)}" r="4" fill="${rich}"/>
      <circle cx="${xh}" cy="${y(compNow)}" r="3" fill="${poor}"/>
      <text x="${w}" y="${h - 8}" text-anchor="end" font-size="11" fill="${soft}" font-family="IBM Plex Sans,sans-serif">α →</text>
      <text x="6" y="${y(DATA.pop[0].rich) - 8}" font-size="11.5" fill="${rich}" font-family="IBM Plex Sans,sans-serif">chooses the ${richObj.value} goal</text>
      <text x="6" y="${y(DATA.pop[0].reached) + 15}" font-size="11.5" fill="${poor}" font-family="IBM Plex Sans,sans-serif">reaches a goal at all</text>
      <text x="${w - 4}" y="${y(basinFrac(L, DATA.pop.length - 1)) + 15}" text-anchor="end" font-size="11" fill="${soft}" font-family="IBM Plex Sans,sans-serif">· · this maze's cells</text>`;
  }

  // ---- chips / legend / caption / level buttons ----
  function updateChips() {
    const p = DATA.pop[nearest(alpha)];
    document.getElementById("chips").innerHTML =
      `<span>chooses ${richObj.value}-goal <b>${Math.round(p.rich * 100)}%</b></span>` +
      `<span>reaches a goal <b>${Math.round(p.reached * 100)}%</b></span>` +
      `<span>extra steps <b>${p.excess >= 0 ? "+" : ""}${p.excess.toFixed(1)}</b></span>`;
    document.getElementById("alphaOut").textContent = "α = " + alpha.toFixed(2);
  }
  function buildStatic() {
    document.getElementById("legend").innerHTML =
      `<span><i class="swatch" style="background:var(--rich-tint)"></i>starts here → takes the 1.0 goal</span>` +
      `<span><i class="swatch" style="background:var(--poor-tint)"></i>starts here → takes the 0.5 goal</span>` +
      `<span><i class="swatch" style="background:var(--wall)"></i>wall</span>` +
      `<span style="font-style:italic">hover/tap a cell: solid = agent's route, dashed = optimal route</span>`;
    const holder = document.getElementById("levels");
    holder.innerHTML = "<span>maze:</span>" + DATA.levels.map((lv, i) =>
      `<button type="button" data-i="${i}" aria-pressed="${i === 0}">${String.fromCharCode(65 + i)}</button>`).join("");
    holder.querySelectorAll("button").forEach(b =>
      b.addEventListener("click", () => selectLevel(+b.dataset.i)));
    document.getElementById("caption").innerHTML =
      `The maze task pays a goal's value minus 0.05 per step, so the trained agent takes the 1.0 goal unless the ` +
      `0.5 goal is much closer. Fine-tuning this agent across a grid of goal values moves its weights along one ` +
      `straight line <b>v</b>; adding α·<b>v</b> to the frozen weights re-draws its decision boundary exactly as ` +
      `if the 0.5 goal were worth 0.5&hairsp;+&hairsp;α — while the agent keeps taking shortest paths throughout. ` +
      `The dashed line is where the utility rule says the choice should flip; the colour boundary trails it slightly ` +
      `because the agent's own exchange rate (≈7.7 steps per 0.5 of value) undershoots the rule's 10, and a hovered ` +
      `cell whose solid and dashed routes disagree marks a start where the agent's committed plan overrides the ` +
      `cell-by-cell optimum.` +
      `<span class="meta">DRC agent ${DATA.agent}, axis fitted from the ${DATA.sweep} value-grid fine-tunes; ` +
      `deterministic (argmax) rollouts; curves from 512 held-out mazes per α. Prototype — colours, level and copy all up for grabs.</span>`;
  }

  // ---- interaction ----
  function setAlpha(a, fromUser) {
    sweepA = Math.min(A1, Math.max(A0, a));
    // snap to the nearest decoded alpha: every position the dial lands on is a
    // real write + decode, never an interpolated frame
    alpha = alphas[nearest(sweepA)];
    slider.value = alpha;
    if (fromUser) stop();
    updateChips(); drawAxis(); drawCurve();
  }
  function stop() { playing = false; document.getElementById("playBtn").textContent = "Resume sweep"; }
  slider.addEventListener("input", () => setAlpha(parseFloat(slider.value), true));
  document.getElementById("playBtn").addEventListener("click", () => {
    playing = !playing;
    document.getElementById("playBtn").textContent = playing ? "Pause sweep" : "Resume sweep";
  });
  document.getElementById("ruleBox").addEventListener("change", e => { showRule = e.target.checked; });

  const tip = document.getElementById("tip");
  // a tap pins the trajectory so touch users get the hover layer
  function inspect(e, byTap) {
    const rect = maze.getBoundingClientRect();
    const c = Math.floor((e.clientX - rect.left - pad) / cell);
    const r = Math.floor((e.clientY - rect.top - pad) / cell);
    const key = r + "," + c;
    if (startIndex.has(key)) {
      hovered = key;
      if (byTap) pinned = true;
      const idx = startIndex.get(key), f = nearest(alpha), fr = L.runs[f];
      const o = fr.o[idx];
      const goal = o === "-" ? null : L.objectives.find(g => g.feature_id === +o);
      const shortest = goal ? L.dist[L.objectives.indexOf(goal)][r][c] : null;
      const best = predictedRich(r, c, alpha) ? richObj : poorObj;
      const bestD = L.dist[L.objectives.indexOf(best)][r][c];
      if (o === "-") tip.textContent = "times out from here";
      else if (goal === best && shortest === fr.s[idx]) tip.textContent = `→ ${goal.value} goal in ${fr.s[idx]} steps (optimal)`;
      else if (goal === best) tip.textContent = `→ ${goal.value} goal in ${fr.s[idx]} steps (shortest ${shortest})`;
      else tip.textContent = `agent → ${goal.value} goal in ${fr.s[idx]} · rule → ${best.value} goal in ${bestD}`;
      tip.style.left = (maze.offsetLeft + pad + c * cell + cell / 2) + "px";
      tip.style.top = (maze.offsetTop + pad + r * cell) + "px";
      tip.style.opacity = 1;
    } else { hovered = null; pinned = false; tip.style.opacity = 0; }
  }
  maze.addEventListener("mousemove", e => { if (!pinned) inspect(e, false); });
  maze.addEventListener("click", e => inspect(e, true));
  maze.addEventListener("mouseleave", () => { if (!pinned) { hovered = null; tip.style.opacity = 0; } });

  // ---- main loop ----
  let last = performance.now();
  function tick(now) {
    const dt = Math.min(0.1, (now - last) / 1000); last = now;
    if (playing) {
      const speed = (A1 - A0) / 9;
      let a = sweepA + sweepDir * speed * dt;
      if (a >= A1) { a = A1; sweepDir = -1; }
      if (a <= A0) { a = A0; sweepDir = 1; }
      setAlpha(a, false);
    }
    drawMaze();
    requestAnimationFrame(tick);
  }

  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { palette(); drawAxis(); drawCurve(); });
  addEventListener("resize", () => { layout(); drawAxis(); drawCurve(); });

  palette(); buildStatic(); selectLevel(0); setAlpha(playing ? A0 : 0, false);
  requestAnimationFrame(tick);
})();
</script>

</body>
</html>
